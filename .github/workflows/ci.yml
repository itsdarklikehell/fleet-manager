name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bash syntax
        run: |
          for script in scripts/*.sh lib/*.sh; do
            echo "Checking $script..."
            bash -n "$script"
          done
      - name: Check shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh lib/*.sh || true

  test-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite
        run: |
          bash scripts/test-suite.sh
      - name: Run health check
        run: |
          bash scripts/health-check.sh || true
      - name: Run cron audit
        run: |
          bash scripts/cron-audit.sh

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check script quality
        run: |
          total=0
          no_set_e=0
          no_dry_run=0
          for script in scripts/*.sh; do
            total=$((total + 1))
            grep -q 'set -e' "$script" || no_set_e=$((no_set_e + 1))
            grep -q 'DRY_RUN' "$script" || no_dry_run=$((no_dry_run + 1))
          done
          echo "Total scripts: $total"
          echo "Without set -e: $no_set_e"
          echo "Without DRY_RUN: $no_dry_run"
