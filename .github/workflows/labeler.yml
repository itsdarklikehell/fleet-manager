name: Labeler
on:
  pull_request:
    types: [opened, edited, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        continue-on-error: true
        with:
          configuration-path: .github/labeler.yml
